app = 'battalion-website'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  SURREALDB_URL = "battalion-surrealdb.internal:8000"

[http_service]
  internal_port = 6969
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
